name: Scheduled scrape

on:
  schedule:
    # 03:00 UTC daily (10:00 ICT) — well past Wikipedia's low-traffic window,
    # once a day is plenty for a list that changes on the order of days/weeks.
    - cron: "0 3 * * *"
  workflow_dispatch: {} # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python -m scraper.run

      - name: Commit updated data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/scraped.db
          git diff --cached --quiet && echo "no changes to commit" || git commit -m "chore: scheduled scrape data update"
          git push
